<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Black Flower</title>
    
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/experiment.css" />
    <link rel="stylesheet" href="css/infiniteflower.css" />
  </head>
  <body>
    <top-nav></top-nav>

    <div id="ui">
      <button class="snap-btn" onclick="captureFlower()">
        <div class="viewfinder">
          <div class="viewfinder-corner tl-corner"></div>
          <div class="viewfinder-corner tr-corner"></div>
          <div class="viewfinder-corner bl-corner"></div>
          <div class="viewfinder-corner br-corner"></div>
          <div class="center-circle"></div>
        </div>
        <span class="snap-label">Snap</span>
      </button>
    </div>
    
    <div id="color-controls">
      <div class="control-block">
        <label>Background</label>
        <input type="range" id="bgColor" class="color-slider" min="0" max="100" value="0">
        <input type="range" id="bgIntensity" class="intensity-slider" min="0" max="100" value="0">
      </div>
      <div class="control-block">
        <label>Flower Fill</label>
        <input type="range" id="flowerColor" class="color-slider" min="0" max="100" value="0">
        <input type="range" id="flowerIntensity" class="intensity-slider" min="0" max="100" value="0">
      </div>
      <div class="control-block">
        <label>Flower Line</label>
        <input type="range" id="lineColor" class="color-slider" min="0" max="100" value="0">
        <input type="range" id="lineIntensity" class="intensity-slider" min="0" max="100" value="100">
      </div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script src="js/nav.js"></script>
    <script src="js/infiniteflower.js"></script>
  </body>
</html>
